name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the runner and guest tools
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Check the runner's entitlement
        run: codesign -d --entitlements - runner/.build/release/agent-vm-runner 2>&1 | grep -q com.apple.security.virtualization
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/agent-vm-*-arm64-apple-darwin.tar.gz --clobber
